name: Static Analysis

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5
  compile:
    name: Byte-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q src curriculum_learning.py inference_phase2.py evaluation scripts
      - run: pip install ruff && ruff check --select E9,F63,F7,F82 src curriculum_learning.py
