[project]
name = "lotus"
version = "0.1.0"
description = "LOTUS: Learning to Understand Time-series by Learning to Forecast"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = [
    "time-series",
    "large-language-models",
    "forecast-grounding",
    "multimodal",
    "time-series-language-model"
]

dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "torch>=2.0",
    "tqdm>=4.62",
    "matplotlib>=3.3",
    "scikit-learn>=1.0",
    "transformers>=4.25",
    "huggingface-hub>=0.16",
    "datasets>=2.0",
    "peft>=0.4",
    "requests>=2.28",
    "einops>=0.6",
    "wfdb>=4.0",
    "wandb",
    "pyarrow",
]

[project.optional-dependencies]
# Only the OpenTSLMFlamingo size-matched baseline (--model OpenTSLMFlamingo)
# needs open_flamingo; the main model and the OpenTSLMSP baseline do not.
baselines = ["open-flamingo>=0.0.2"]

[project.urls]
Repository = "https://github.com/DA2I2-SLM/Lotus"
"Bug Tracker" = "https://github.com/DA2I2-SLM/Lotus/issues"

[dependency-groups]
dev = [
    "reuse>=6.2.0",
    "ruff>=0.14.0",
]

eval = [
    "openai>=1.0",
]

notebook = [
    "jupyter>=1.0",
    "ipython>=8.0",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The distribution is "lotus" but the import package is still `opentslm`
# (src/opentslm, imported by 153 files and by every --model value in the
# launchers), so uv_build must be told the module path explicitly instead of
# inferring src/lotus/ from the project name.
module-name = "opentslm"

[tool.uv]
required-version = ">=0.9"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py312"
